<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website - Photos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="hamburger-btn" id="menu-toggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav class="sidebar" id="sidebar">
        <button class="close-btn" id="close-btn" aria-label="Close Navigation">&times;</button>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="photos.html" class="active-link">Photos</a></li>
            <li><a href="#games">Games</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="recipes.html">Recipes</a></li>
            <li><a href="#etc">Etc.</a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="refresh-btn" id="refresh-btn" title="Refresh Page">&#x21bb; Refresh Page</button>
        </div>
    </nav>
    <div class="overlay" id="overlay"></div>
    <main class="gallery-container">
        <div class="notes-controls" style="margin-bottom: 15px;">
            <button id="add-photo-btn" class="btn-primary">+ Upload Photo</button>
        </div>
        <div class="category-scroll-wrapper">
            <div class="category-scroll" id="photo-category-filters">
                <button class="category-pill active" data-category="all">All</button>
                <button class="category-pill" data-category="adult">Adult</button>
                <button class="category-pill" data-category="panties">Panties</button>
                <button class="category-pill" data-category="toy">Toy</button>
                <button class="category-pill" data-category="messy">Messy</button>
                <button class="category-pill" data-category="friends">Friends</button>
                <button class="category-pill" data-category="family">Family</button>
                <button class="category-pill" data-category="food">Food</button>
                <button class="category-pill" data-category="memorys">Memorys</button>
                <button class="category-pill" data-category="etc">Ect</button>
            </div>
        </div>
        <div class="photo-grid" id="photo-grid">
            <div class="photo-card" data-category="adult">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Adult sample">
            </div>
            <div class="photo-card" data-category="panties">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Panties sample">
            </div>
            <div class="photo-card" data-category="toy">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Toy sample">
            </div>
            <div class="photo-card" data-category="messy">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Messy sample">
            </div>
        </div>
    </main>
    <div class="photo-upload-modal" id="photo-modal">
        <div class="modal-content" style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; text-align: left; margin: auto;">
            <h3 style="margin-top: 0; color: var(--text-primary);">Upload New Photo</h3>
            <div style="margin: 15px 0; display: flex; flex-direction: column; gap: 10px;">
                <label style="font-size: 14px; font-weight: bold;">Select Image File:</label>
                <input type="file" id="photo-file-input" accept="image/*">
                <label style="font-size: 14px; font-weight: bold; margin-top: 10px;">Category Name:</label>
                <input type="text" id="photo-category-input" class="doc-title-input" placeholder="e.g. Adult, Panties, Toy..." style="border: 1px solid var(--border-color); border-radius: 4px; width: 100%; box-sizing: border-box;">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button id="photo-modal-close-btn" class="btn-danger" style="margin:0;">Cancel</button>
                <button id="save-photo-btn" class="btn-primary">Upload</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
