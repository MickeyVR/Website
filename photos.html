<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos - My Personal Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>My Website</h1>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/photos" class="active">Photos</a></li>
                <li><a href="/notes">Notes</a></li>
                <li><a href="/recipes">Recipes</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Photo Gallery</h2>
        <div class="upload-section">
            <input type="file" id="photo-file-input" accept="image/*">
            <input type="text" id="photo-category-input" placeholder="Category (e.g., Nature, Family)...">
            <button id="save-photo-btn" class="btn-primary">Upload Photo</button>
        </div>
        <div id="photo-filters"></div>
        <div id="photo-grid" class="grid-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
