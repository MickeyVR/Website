<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website - Home</title>
    <!-- Connects your HTML skeleton to your CSS styling file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top-Left Hamburger Menu Button (3 Lines) -->
    <button class="hamburger-btn" id="menu-toggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Left Slide-Out Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <!-- Close Button (X) inside Sidebar -->
        <button class="close-btn" id="close-btn" aria-label="Close Navigation">&times;</button>
        
        <!-- Navigation Tabs -->
        <ul>
            <li><a href="index.html" class="active-link">Home</a></li>
            <li><a href="photos.html">Photos</a></li>
            <li><a href="#games">Games</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="recipes.html">Recipes</a></li>
            <li><a href="#etc">Etc.</a></li>
        </ul>

        <!-- Refresh Button pinned to the bottom of the Sidebar -->
        <div class="sidebar-footer">
            <button class="refresh-btn" id="refresh-btn" title="Refresh Page">
                &#x21bb; Refresh Page
            </button>
        </div>
    </nav>

    <!-- Darkened overlay background when sidebar is open -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Page Content -->
    <main class="content" id="home">
        <section class="about-card">
            <h2>About Me</h2>
            <p>Hello! This is my very first personal website built using HTML and CSS.</p>
        </section>
    </main>

    <!-- Connects your HTML skeleton to your JavaScript interactivity file -->
    <script src="script.js"></script>
</body>
</html>
